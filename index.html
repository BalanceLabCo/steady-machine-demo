<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steady Machine — Personal Budget Planner</title>
<style>
:root{--bg:#f1f5f4;--card:#fff;--tx:#17232d;--mut:#5d6e79;--ac:#17695e;--bt:#fff;--hi:#d99a1c;--bad:#b4364f;--ln:#dae3e1;--sb:#13212b}
[data-t=plum]{--bg:#f5f2f8;--ac:#6b3fa0;--sb:#251838;--ln:#e3dcec}
[data-t=sea]{--bg:#eef3f9;--ac:#2a58a3;--sb:#12223a;--ln:#d9e3f0}
[data-t=night]{color-scheme:dark;--bg:#0f151b;--card:#18222a;--tx:#e8eef2;--mut:#9aaab5;--ac:#5cc4b0;--bt:#0c1115;--bad:#ef7f98;--ln:#273540;--sb:#0a0f13}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
#nav{background:var(--sb);color:#fff;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:700 20px Georgia,serif;margin:0 8px 12px}.brand small{display:block;font:12px system-ui,sans-serif;color:#9db0bb;margin-top:2px}
#nav a{display:block;padding:7px 10px;border-radius:8px;color:#cfdae1;text-decoration:none;margin-bottom:2px}
#nav a.on{background:var(--ac);color:var(--bt);font-weight:600}.hint{color:#9db0bb;font-size:13px;margin:14px 8px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--ln)}
.ttl{font-size:18px}main{padding:14px 20px 28px}
main>h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h3{margin:0 0 6px;font-size:14px}
.hero{background:var(--sb);color:#fff;border-radius:12px;padding:16px 22px;margin-bottom:12px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
.hero h1{font:700 34px/1.1 Georgia,serif;margin:8px 0}.hero p{color:#b8c7d0;max-width:48ch;margin:0}
.pill{display:inline-block;border:1px solid #3a5160;border-radius:20px;padding:3px 12px;color:#b8c7d0;font-size:13px}
.hk{background:rgba(255,255,255,.07);border-radius:10px;padding:12px 14px}.hero .mut{color:#b8c7d0}.hero .bar{background:#2c4352}.hero .bad{color:#ffb3c0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.g,.g2{display:grid;gap:12px;margin-bottom:12px}.g{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.gc{grid-template-columns:2fr 1fr}
.g .card,.g2 .card{margin:0}
.big{font:700 28px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
.num,td,th{font-variant-numeric:tabular-nums lining-nums}
.mut{color:var(--mut)}.bad{color:var(--bad)}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mut);font-weight:600;font-size:13px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input,.row select{flex:1 1 140px}
.b{display:inline-block;background:var(--ac);color:var(--bt);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.b.o{background:none;color:var(--ac);border:1px solid var(--ac)}.x{background:none;border:0;color:var(--mut);cursor:pointer}
.seg{display:flex;border:1px solid var(--ln);border-radius:9px;padding:2px;background:var(--card)}.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer}.seg button.on{background:var(--ac);color:var(--bt)}
.bar{height:9px;background:var(--ln);border-radius:5px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}
.ax{font:11px system-ui,sans-serif;fill:var(--mut)}.dn{font:700 14px system-ui,sans-serif;fill:var(--tx)}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);padding:20px;width:min(380px,92vw)}dialog::backdrop{background:rgba(0,0,0,.45)}.col{display:grid;gap:8px;margin:12px 0}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
[data-t=night] .b.d{background:#2a3b47}.b.d{background:var(--sb);color:#fff}.b{padding:7px 12px}.card svg{max-height:300px}.hero h1{text-wrap:balance}.s2 .ax{font-size:14px}[aria-invalid=true]{border-color:var(--bad)}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--sb);color:#fff;border:1px solid var(--ln);border-radius:10px;padding:9px 14px;z-index:30;display:none;gap:14px;align-items:center;max-width:92vw}
#toast.on{display:flex}
#toast button{background:none;border:0;color:#ffd27a;font-weight:700;cursor:pointer;font:inherit}
#fab{display:none;position:fixed;right:16px;bottom:16px;width:52px;height:52px;border-radius:26px;font-size:26px;line-height:1;padding:0;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media(max-width:900px){body{display:block}#nav{height:auto;position:sticky;top:0;z-index:8;display:flex;flex-wrap:nowrap;align-items:center;gap:4px;overflow-x:auto;padding:8px 10px;white-space:nowrap}#nav::-webkit-scrollbar{display:none}.brand{margin:0 10px 0 4px;flex:none;font-size:17px;width:auto}.brand small,.hint{display:none}#nav a{flex:none;margin:0}#top{position:static;padding:10px 16px}main{padding-left:16px;padding-right:16px}.hero{grid-template-columns:1fr}.gc{grid-template-columns:1fr}.hero h1{font-size:28px}input,select,textarea{font-size:16px}#fab{display:block}#toast{bottom:80px}}
@media print{#nav,#top,#fab,#toast{display:none}body{display:block}}
</style></head><body><nav id="nav" aria-label="Main menu"></nav><div><header id="top"></header><main></main></div>
<dialog id="dlg" aria-labelledby="dlgt"><h3 id="dlgt">Add transaction</h3><div class="col" onkeydown="if(event.key==='Enter'&&event.target.tagName!=='SELECT'){event.preventDefault();qsave()}"><select id="qt" aria-label="Type" onchange="$('#qc').hidden=this.value==='Income'"><option>Expense</option><option>Income</option></select><input id="qm" type="number" step="any" min="0" placeholder="Amount" aria-label="Amount"><select id="qc" aria-label="Category"></select><select id="qw" aria-label="Who" hidden></select><input id="qd" type="date" aria-label="Date"><input id="qn" placeholder="Description" aria-label="Description"></div><div class="row"><button class="b" onclick="qsave()">Save</button><button class="b o" onclick="$('#dlg').close()">Cancel</button></div></dialog>
<dialog id="dlg2" aria-labelledby="d2t"><h3 id="d2t"></h3><p id="d2m" class="mut"></p><input id="d2i" type="number" step="any" min="0" aria-label="Amount" hidden><div class="row" style="margin-top:12px"><button class="b" id="d2ok">OK</button><button class="b o" onclick="$('#dlg2').close()">Cancel</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><button id="fab" class="b" onclick="quick()" aria-label="Add transaction">+</button>
<script>
const K='steadybudget1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),P={},LF={};
let S,page='home',now=new Date();
const D={mode:'all',theme:'teal',cur:'USD',hh:0,who:['Me','Partner'],cats:['Housing','Food','Transport','Utilities','Health','Fun','Other'],income:[],bills:[],tx:[],plan:{},debts:[],funds:[],accts:[],notes:{},extra:0};
const cp0=()=>JSON.parse(JSON.stringify(D));
const CUR=[['USD','$','US Dollar'],['GBP','£','British Pound'],['EUR','€','Euro'],['CAD','$','Canadian Dollar'],['AUD','$','Australian Dollar'],['PKR','Rs','Pakistani Rupee'],['INR','₹','Indian Rupee'],['JPY','¥','Japanese Yen'],['NZD','$','New Zealand Dollar'],['ZAR','R','South African Rand'],['AED','Dh','UAE Dirham'],['SAR','SR','Saudi Riyal']];
const THEMES=['teal','plum','sea','night'];
function norm(o){const x=cp0();for(const k in D){if(k==='hh')continue;const v=o[k];if(v!=null&&typeof v===typeof D[k]&&Array.isArray(v)===Array.isArray(D[k]))x[k]=v}
x.hh=o.hh?1:0;['v','bk','pt','rv','pay'].forEach(k=>{if(o[k]!=null)x[k]=o[k]});
if(!CUR.some(c=>c[0]===x.cur))x.cur='USD';if(!THEMES.includes(x.theme))x.theme='teal';if(x.pt&&!THEMES.includes(x.pt))x.pt='teal';if(!['all','easy'].includes(x.mode))x.mode='all';
x.who=(Array.isArray(x.who)?x.who:[]).slice(0,2).map(String);while(x.who.length<2)x.who.push(x.who.length?'Partner':'Me');if(x.who[0]===x.who[1])x.who[1]+=' 2';
x.cats=x.cats.map(String).filter(Boolean);if(!x.cats.length)x.cats=D.cats.slice();
['income','bills','tx','debts','funds','accts'].forEach(k=>{x[k]=x[k].filter(r=>r&&typeof r==='object'&&!Array.isArray(r)).map(r=>Object.assign({id:uid()},r))});
return x}
try{const raw=JSON.parse(localStorage.getItem(K)||'{}')||{};S=norm(raw);if(!raw.theme&&matchMedia('(prefers-color-scheme: dark)').matches){S.theme='night';S.pt='teal'}}catch(e){S=cp0()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const APP='Steady Machine';S.v=2;
const pad=n=>String(n).padStart(2,'0'),mk=d=>{d=d||now;return d.getFullYear()+'-'+pad(d.getMonth()+1)},td=()=>mk()+'-'+pad(now.getDate());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>{n=Math.round((+n||0)*100)/100;const d=Number.isInteger(n)?0:2;try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.cur,minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}catch(e){return n.toFixed(d)}},
mc=n=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.cur,notation:'compact',maximumFractionDigits:1}).format(+n||0)}catch(e){return String(Math.round(+n||0))}};
const sum=(a,f)=>a.reduce((t,x)=>t+(+(f?f(x):x)||0),0),inM=(a,m)=>a.filter(x=>(x.date||'').startsWith(m));
const months=n=>{const a=[];for(let i=n-1;i>=0;i--)a.push(mk(new Date(now.getFullYear(),now.getMonth()-i,1)));return a};
const st=(l,v,c)=>`<div class="card"><div class="mut">${l}</div><div class="big s ${c||''}">${v}</div></div>`;
const W=()=>S.hh?[{k:'who',l:'Who',t:'select',o:S.who}]:[];
const nw=()=>sum(S.accts.filter(x=>x.type==='Asset'),x=>x.bal)-sum(S.accts.filter(x=>x.type==='Liability'),x=>x.bal)-sum(S.debts,x=>x.bal);
function calc(m){m=m||mk();const inc=sum(inM(S.income,m),x=>x.amt),sp=inM(S.tx,m),spent=sum(sp,x=>x.amt),bills=sum(S.bills,x=>x.amt),fund=sum(S.funds,x=>x.monthly),dl=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1,safe=inc-bills-fund-spent;return{inc,spent,bills,fund,safe,dl,per:safe/dl,sp}}
const NAV=[['home','Dashboard'],['income','Income'],['bills','Recurring bills'],['spend','Transactions'],['funds','Savings goals'],['pay','Paycheck planner',1],['budget','Zero-based budget',1],['debt','Debt strategy',1],['worth','Net worth',1],['review','Monthly review',1],['settings','Settings']];
function F(f){const id='f_'+f.k;if(f.t==='select')return `<select id="${id}" aria-label="${f.l}">${f.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
if(f.t==='check')return `<label><input type="checkbox" id="${id}"> ${f.l}</label>`;
return `<input id="${id}" type="${f.t||'text'}" placeholder="${f.l}" aria-label="${f.l}" ${f.t==='number'?'step="any" min="0"':''} ${f.v?`value="${f.v}"`:''}>`}
function list(key,title,f,note,x){LF[key]={f};let a=S[key];if(key==='tx'||key==='income')a=a.slice().sort((p,q)=>q.date>p.date?1:-1);if(key==='bills')a=a.slice().sort((p,q)=>p.day-q.day);
const rows=a.map(r=>`<tr>${f.map(c=>`<td>${c.t==='check'?(r[c.k]?'Yes':''):c.m?money(r[c.k]):esc(r[c.k])}</td>`).join('')}${x?`<td>${x.fn(r)}</td>`:''}<td style="white-space:nowrap"><button class="x" onclick="edt('${key}','${r.id}')" aria-label="Edit">✎</button><button class="x" onclick="del('${key}','${r.id}')" aria-label="Delete">✕</button></td></tr>`).join('');
return `<div class="card"><h3 id="lt_${key}">${title}</h3>${note?`<p class="mut">${note}</p>`:''}<div class="row" onkeydown="if(event.key==='Enter'&&event.target.tagName==='INPUT'){event.preventDefault();add('${key}')}">${f.map(F).join('')}<button class="b" id="ab_${key}" onclick="add('${key}')">Add</button><button class="b o" id="ac_${key}" hidden onclick="go()">Cancel</button><button class="b d" onclick="exp('${key}')">Export CSV</button></div></div><div class="card tw"><table><tr>${f.map(c=>`<th>${c.l}</th>`).join('')}${x?`<th>${x.h}</th>`:''}<th></th></tr>${rows||'<tr><td class="mut">No records yet.</td></tr>'}</table></div>`}
function add(key){const o={};for(const f of LF[key].f){const e=$('#f_'+f.k);o[f.k]=f.t==='check'?e.checked:f.t==='number'?+e.value:e.value}
LF[key].f.forEach(f=>{const e=$('#f_'+f.k);if(e)e.removeAttribute('aria-invalid')});
const bad=LF[key].f.find(f=>(f.r&&!o[f.k])||(f.t==='number'&&o[f.k]<0)||(f.k==='day'&&o[f.k]>31));
if(bad){const e=$('#f_'+bad.k);e.setAttribute('aria-invalid','true');e.focus();return toast(o[bad.k]<0?'Amounts cannot be negative':bad.k==='day'&&o.day>31?'Day must be between 1 and 31':'Please fill in the required fields')}
if(key==='bills')o.day=Math.min(31,Math.max(1,Math.round(o.day)||1));
const ed=LF[key].edit,first=LF[key].f[0].k;
if(ed){const i=S[key].findIndex(r=>r.id===ed);if(i>-1)S[key][i]=Object.assign({},S[key][i],o)}else S[key].push(Object.assign({id:uid()},o));
save();go();const fe=$('#f_'+first);if(fe)fe.focus({preventScroll:true});toast(ed?'Changes saved':'Added')}
function edt(key,id){const r=S[key].find(x=>x.id===id);if(!r)return;LF[key].edit=id;
for(const f of LF[key].f){const e=$('#f_'+f.k);if(!e)continue;if(f.t==='check')e.checked=!!r[f.k];else e.value=r[f.k]==null?'':r[f.k]}
$('#ab_'+key).textContent='Save changes';$('#ac_'+key).hidden=false;$('#lt_'+key).scrollIntoView({block:'center',behavior:'smooth'});const e0=$('#f_'+LF[key].f[0].k);if(e0)e0.focus({preventScroll:true})}
function del(k,id){const i=S[k].findIndex(r=>r.id===id);if(i<0)return;const r=S[k].splice(i,1)[0];save();go();toast('Deleted',()=>{S[k].splice(Math.min(i,S[k].length),0,r);save();go()})}
function paid(id){const b=S.bills.find(r=>r.id===id);b.paid=b.paid===mk()?'':mk();save();go()}
function topup(id){ask('Add money','How much do you want to add?','50',v=>{v=+v;if(v>0){const f=S.funds.find(r=>r.id===id);f.saved=(+f.saved||0)+v;save();go();toast('Added '+money(v))}})}
P.home=()=>{const c=calc(),m=mk(),full=S.mode==='all',dm=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),pm=Math.round(now.getDate()/dm*100),um=c.inc?Math.min(100,Math.round((c.bills+c.fund+c.spent)/c.inc*100)):0,ah=um>pm+10,by={};
c.sp.forEach(x=>by[x.cat]=(by[x.cat]||0)+ +x.amt);const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]),up=S.bills.filter(b=>b.paid!==m).sort((a,b)=>a.day-b.day).slice(0,6),debt=sum(S.debts,x=>x.bal);
const ks=months(6),i6=ks.map(k=>sum(inM(S.income,k),x=>x.amt)),o6=ks.map((k,i)=>{const s=sum(inM(S.tx,k),x=>x.amt);return s+(i6[i]||s?c.bills+c.fund:0)}),mn=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString(undefined,{month:'short'});
const daily=[],plan=[];let cum=0;for(let d=1;d<=dm;d++){cum+=sum(c.sp.filter(x=>+x.date.slice(8,10)===d),x=>x.amt);daily.push(d<=now.getDate()?cum:null);plan.push((c.inc-c.bills-c.fund)*d/dm)}
const lg=(a,b)=>`<div class="mut"><span class="dot" style="background:var(--ac)"></span>${a}<span class="dot" style="background:var(--hi);margin-left:14px"></span>${b}</div>`;
let h=`<section class="hero"><div><span class="pill">${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span><h1>${APP} — Personal Budget Planner</h1><p>Know what you can spend, plan what you owe, and track what you build.</p></div><div class="hk"><div class="mut">Available to spend</div><div class="big ${c.safe<0?'bad':''}">${money(c.safe)}</div><div class="mut">About ${money(Math.max(0,c.per))} per day for the next ${c.dl} days</div>${c.inc<c.bills+c.fund?'<div class="mut" style="margin-top:8px;font-size:13px">Tip: this month income is lower than bills and goals. Add your paychecks for an accurate number.</div>':''}<div class="mut" style="margin-top:12px">Month elapsed: ${pm}%</div><div class="bar"><i style="width:${pm}%;background:#8fa3b0"></i></div><div class="mut">Income committed: ${um}%${ah?' (ahead of pace)':''}</div><div class="bar"><i style="width:${um}%;background:${ah?'#ff8fa5':'var(--hi)'}"></i></div></div></section>`;
if(!S.income.length&&!S.bills.length&&!S.tx.length)h+=`<div class="card"><h3>Get started</h3><p>Record your income and recurring bills to activate the dashboard, or explore with sample data first.</p><div class="row"><button class="b" onclick="demo()">Explore with sample data</button><button class="b o" onclick="go('income')">Add my income</button></div></div>`;
h+=`<div class="g">${st('Income this month',money(c.inc))}${st('Recurring bills',money(c.bills))}${st('Expenses to date',money(c.spent))}${st('Set aside for goals',money(c.fund))}${full?st('Net worth',money(nw()),nw()<0?'bad':'')+st('Total debt',money(debt)):''}</div>`;
if(full)h+=`<div class="g2 gc"><div class="card"><h3>Income versus outgoings, last 6 months</h3>${bars(ks.map(mn),[i6,o6],['var(--ac)','var(--hi)'])}${lg('Income','Bills, goals and expenses')}</div><div class="card"><h3>Spending by category</h3>${donut(cats)}</div></div>
<div class="g2"><div class="card"><h3>Spending pace</h3>${line([daily,plan],['var(--ac)','var(--hi)'],'Day of month')}${lg('Actual','Even-pace allowance')}</div><div class="card"><h3>${S.hh?'Spending by person':'Debt balances'}</h3>${S.hh?S.who.map(w=>`<div class="row" style="justify-content:space-between"><span>${esc(w)}</span><b class="num">${money(sum(c.sp.filter(x=>x.who===w),x=>x.amt))}</b></div>`).join(''):S.debts.map(d=>`<div class="row" style="justify-content:space-between"><span>${esc(d.name)}</span><b class="num">${money(d.bal)}</b></div>`).join('')||'<span class="mut">No debts recorded.</span>'}</div>`;
h+=`${full?'':'<div class="g2">'}<div class="card"><h3>Upcoming bills</h3>${up.map(b=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;padding:6px 0;border-bottom:1px solid var(--ln)"><span style="white-space:nowrap">Day ${b.day}: ${esc(b.name)}${b.day<now.getDate()?' <span class="bad">(overdue)</span>':''}</span><span class="num"><b>${money(b.amt)}</b> <button class="b o" style="padding:3px 10px" title="Mark as paid" onclick="paid('${b.id}')">Paid</button></span></div>`).join('')||'<span class="mut">No outstanding bills.</span>'}</div><div class="card"><h3>Savings goals</h3>${S.funds.map(f=>`<div>${esc(f.name)}: <b class="num">${money(f.saved)}</b> of ${money(f.target)}<div class="bar"><i style="width:${Math.min(100,f.saved/f.target*100||0)}%"></i></div></div>`).join('')||'<span class="mut">No goals recorded.</span>'}</div></div>`;
const stale=S.bk&&(now-new Date(S.bk+'T00:00:00'))/864e5>30;return h+((!S.bk||stale)&&(S.tx.length||S.bills.length)?'<p class="mut">'+(S.bk?'Your last backup is over 30 days old. ':'Recommendation: ')+'open Settings and use Export JSON backup so your data is protected.</p>':'')};
P.income=()=>{const v=months(3).map(k=>sum(inM(S.income,k),x=>x.amt));return '<h2>Income</h2>'+list('income','Add income',[{k:'name',l:'Source',r:1},{k:'amt',l:'Amount',t:'number',m:1,r:1},{k:'date',l:'Date',t:'date',v:td(),r:1},{k:'type',l:'Type',t:'select',o:['Regular','Irregular','Tip']},...W()])+(S.mode==='all'?`<div class="card"><h3>Irregular income check</h3><p>Average of the last 3 months: <b>${money(sum(v)/3)}</b>. Lowest month: <b>${money(Math.min(...v))}</b>. Budgeting from the lowest month keeps slow months from hurting.</p></div>`:'')};

const COL=['var(--ac)','var(--hi)','#5b7fd1','#b4364f','#8a63c9','#3aa7a0','#8a949c','#e08a3c','#2f9e6b','#c2579f','#7a8b2f','#4a6fa5'];
const mw=()=>innerWidth<900?Math.max(320,innerWidth-70):760;
function donut(d){const t=sum(d,x=>x[1]);if(!t)return '<p class="mut">No data recorded yet.</p>';let a=0;const r=52,C=2*Math.PI*r,sg=d.map((x,i)=>{const l=x[1]/t*C,s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${COL[i%COL.length]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 70 70)"/>`;a+=l;return s}).join('');
return `<div class="row"><svg viewBox="0 0 140 140" width="120" role="img" aria-label="Spending by category">${sg}<text x="70" y="75" text-anchor="middle" class="dn">${money(t)}</text></svg><div>${d.map((x,i)=>`<div><span class="dot" style="background:${COL[i%COL.length]}"></span>${esc(x[0])} <b class="num">${money(x[1])}</b></div>`).join('')}</div></div>`}
function bars(lb,ss,cl){const W=mw(),H=innerWidth<900?200:180,m=Math.max(1,...ss.flat()),w=W/lb.length,bw=Math.min(18,w*.2);let g='',t='';for(let i=1;i<=4;i++){const y=H-28-(H-44)*i/4;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--ln)"/>`;t+=`<text x="0" y="${y-3}" class="ax">${mc(m*i/4)}</text>`}
lb.forEach((l,i)=>{ss.forEach((s,j)=>{const hh=(H-44)*s[i]/m;g+=`<rect x="${i*w+w/2-bw*ss.length/2+j*bw}" y="${H-28-hh}" width="${bw-3}" height="${hh}" rx="3" fill="${ss.length==1&&cl.length>1?cl[i]:cl[j]}"/>`});t+=`<text x="${i*w+w/2}" y="${H-9}" text-anchor="middle" class="ax">${l}</text>`});
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bar chart">${g}${t}</svg>`}
function line(ss,cl,xl,W0){const W=innerWidth<900?mw():(W0||380),H=innerWidth<900?200:(W0?180:200),n=Math.max(2,...ss.map(s=>s.length)),m=Math.max(1,...ss.flat().filter(v=>v!=null));let g='';for(let i=1;i<=4;i++){const y=H-28-(H-44)*i/4;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--ln)"/><text x="0" y="${y-3}" class="ax">${mc(m*i/4)}</text>`}
ss.forEach((s,j)=>{const p=s.map((v,i)=>v==null?null:`${(i/(n-1)*(W-12)+6).toFixed(1)},${(H-28-(H-44)*v/m).toFixed(1)}`).filter(Boolean).join(' ');g+=`<polyline points="${p}" fill="none" stroke="${cl[j]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`});
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Line chart" class="${innerWidth>=900&&!W0?'s2':''}">${g}<text x="${W/2}" y="${H-9}" text-anchor="middle" class="ax">${xl}</text></svg>`}
